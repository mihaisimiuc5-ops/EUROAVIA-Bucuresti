name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Construire aplicație Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descarcă codul sursă
        uses: actions/checkout@v4

      - name: 2. Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Configurează Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21' # Aici am schimbat din 17 in 21

      - name: 4. Instalează pachetele NPM
        run: npm install

      - name: 4.5. Fix pentru permisiuni Capacitor (Instalare globală)
        run: npm install -g @capacitor/cli

      - name: 5. Sincronizează fișierele web cu folderul Android
        run: cap sync android

      - name: 6. Oferă permisiuni de execuție pentru Gradle
        working-directory: ./android
        run: chmod +x gradlew

      - name: 7. Compilează fișierul .APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 8. Salvează APK-ul ca Artifact pentru descărcare
        uses: actions/upload-artifact@v4
        with:
          name: Aplicatia-Mea-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk